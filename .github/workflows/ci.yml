name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade numpy pandas matplotlib pytest nbformat jupyter

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Python tests
        run: python -m pytest -q

      - name: Run browser and parity tests
        run: pnpm test

      - name: Build production application
        run: pnpm build

      - name: Explain full reproducibility boundary
        run: echo "Fast CI uses committed fixtures. Official-data reconstruction is documented in docs/CLEAN_CLONE_REPRODUCTION.md and is run separately."
