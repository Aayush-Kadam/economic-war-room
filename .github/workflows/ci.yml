name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade numpy pandas matplotlib pytest nbformat jupyter

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run fixture-backed Python tests
        run: python -m pytest -q --ignore=tests/test_frozen_sample.py

      - name: Verify full-reproduction test remains present
        run: test -f tests/test_frozen_sample.py && test -f calibration/FROZEN_SAMPLE_MANIFEST.json && test -f calibration/build_frozen_sample.py

      - name: Run browser and parity tests
        run: pnpm test

      - name: Build production application
        run: pnpm build

      - name: Explain full reproducibility boundary
        run: echo "Fast CI runs 80 fixture-backed Python tests, 10 browser/parity tests, and the production build. The four frozen-sample tests run in the documented full workflow after reconstructing ignored official data."
